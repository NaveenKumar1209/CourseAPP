<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Course Registration Form</title>
    <link rel="stylesheet" href="form.css">

</head>
<body>
    <div class="form-container">
        <h2>Virtual Course Registration Form</h2>
        <p style="text-align:center;">Would you like to join our virtual course?</p>
        
        <div class="form-group">
            <label>Student Name:</label>
            <div class="name-group">
                <input type="text" placeholder="First"> 
                <input type="text" placeholder="Last">
            </div>
        </div>
        
        <div class="form-group">
            <label>Phone Number:</label>
            <input type="tel" placeholder="+91 ### ### ####">
        </div>
        
        <div class="form-group">
            <label>Gender:</label>
            <div class="gender-options">
                <label><input type="radio" name="gender"> Male</label>
                <label><input type="radio" name="gender"> Female</label>
                <label><input type="radio" name="gender"> Other</label>
            </div>
        </div>
        
        <div class="form-group">
            <label>Age:</label>
            <input type="number">
        </div>
        
        <div class="form-group">
            <label>School Name:</label>
            <input type="text">
        </div>
        
        <div class="form-group">
            <label>What program are you planning to enroll with?</label>
            <select>
                <option>Please select</option>
                
                <option>JAVA</option>
                <option>REACT JS</option>
                <option>MERN</option>
                <option>DATA STRUCTURE</option>
                <option>DATA SCIENCE</option>
                <option>MACHINE LEARNING</option>
                <option>AI</option>
                <option>IOT</option>
                <option>ANGULAR</option>
                <option>DIGITAL MARKETING</option>
                <option>PYTHON</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Please choose a slot:</label>
            <div class="date-options">
                <label><input type="radio" name="date"> March 1st</label>
                <label><input type="radio" name="date"> April 2nd</label>
                <label><input type="radio" name="date"> May 10th</label>
            </div>
        </div>
        
       
        
        <a href="response.html"><button class="submit-btn">SUBMIT FORM</button></a>
    </div>
</body>
</html>
